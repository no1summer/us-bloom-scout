<style>:root {
  --leaf: #3f9a45;
  --leaf-deep: #1f6b32;
  --sun: #f0c346;
  --sky: #9fd6ef;
  --ink: #16301c;
  --muted: #4a6a52;
  --panel: rgba(247, 252, 246, 0.92);
  --line: rgba(31, 107, 50, 0.14);
  --shadow: 0 18px 50px rgba(22, 48, 28, 0.18);
  --radius: 22px;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Sora", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 12% -10%, #c8efb4 0%, transparent 55%),
    radial-gradient(900px 500px at 100% 0%, #8ec8e8 0%, transparent 50%),
    linear-gradient(165deg, #e8f7df 0%, #d7eef8 48%, #f4f8e8 100%);
  overflow: hidden;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); border: 0;
}

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
}

.brand-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.85rem 1.25rem;
  position: relative;
  z-index: 5;
}

.brand { display: flex; align-items: center; gap: 0.75rem; }
.brand-mark {
  display: grid; place-items: center;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.7);
  box-shadow: 0 8px 20px rgba(31,107,50,0.15);
}

.brand-text h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(1.45rem, 2.4vw, 1.9rem);
  letter-spacing: -0.02em;
  line-height: 1;
}
.brand-text p {
  margin: 0.15rem 0 0;
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 500;
}
.brand-note {
  margin: 0;
  font-size: 0.72rem;
  color: var(--muted);
  background: rgba(255,255,255,0.55);
  border: 1px solid var(--line);
  padding: 0.35rem 0.7rem;
  border-radius: 999px;
}

.stage {
  position: relative;
  margin: 0 0.75rem 0.75rem;
  border-radius: calc(var(--radius) + 4px);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,0.55);
  /* No transform animation — CSS transforms on the map parent make Leaflet tiles flicker */
}

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #cfe8d4;
}

.map-veil {
  pointer-events: none;
  position: absolute;
  inset: 0;
  z-index: 2;
  background:
    linear-gradient(90deg, rgba(22,48,28,0.08), transparent 28%),
    radial-gradient(ellipse at 80% 20%, rgba(240,195,70,0.12), transparent 45%);
}

.panel {
  position: absolute;
  z-index: 3;
  top: 1rem;
  left: 1rem;
  bottom: 1rem;
  width: min(360px, calc(100% - 2rem));
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  padding: 1rem;
  border-radius: var(--radius);
  background: var(--panel);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.7);
  box-shadow: 0 16px 40px rgba(22,48,28,0.14);
  overflow: hidden;
}

.panel-glow {
  position: absolute;
  width: 180px; height: 180px;
  right: -40px; top: -50px;
  background: radial-gradient(circle, rgba(111,191,74,0.28), transparent 70%);
  pointer-events: none;
}

.search-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 0.4rem;
  position: relative;
}

input[type="search"] {
  width: 100%;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.85);
  border-radius: 14px;
  padding: 0.7rem 0.85rem;
  font: inherit;
  font-size: 0.86rem;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type="search"]:focus {
  border-color: var(--leaf);
  box-shadow: 0 0 0 3px rgba(63,154,69,0.18);
}

.primary-btn, .ghost-btn, .icon-btn, .tab {
  font: inherit;
  cursor: pointer;
  border: none;
  transition: transform 0.15s ease, background 0.2s, opacity 0.2s;
}
.primary-btn:hover:not(:disabled), .ghost-btn:hover:not(:disabled), .icon-btn:hover, .tab:hover {
  transform: translateY(-1px);
}
.primary-btn:disabled, .ghost-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.primary-btn {
  background: linear-gradient(135deg, var(--leaf), var(--leaf-deep));
  color: #fff;
  font-weight: 600;
  font-size: 0.84rem;
  border-radius: 14px;
  padding: 0.7rem 0.95rem;
  box-shadow: 0 8px 18px rgba(31,107,50,0.25);
}
.ghost-btn {
  background: rgba(255,255,255,0.7);
  color: var(--leaf-deep);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.65rem 0.85rem;
  font-weight: 600;
  font-size: 0.82rem;
}
.icon-btn {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--line);
  color: var(--leaf-deep);
}

.mode-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.35rem;
  padding: 0.25rem;
  background: rgba(31,107,50,0.08);
  border-radius: 14px;
}
.tab {
  border-radius: 11px;
  padding: 0.55rem 0.4rem;
  background: transparent;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 600;
}
.tab.is-active {
  background: #fff;
  color: var(--leaf-deep);
  box-shadow: 0 4px 12px rgba(22,48,28,0.08);
}

.mode-pane { display: none; }
.mode-pane.is-active { display: block; }

.hint {
  margin: 0 0 0.55rem;
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.4;
}
.field-label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 0.35rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.decor-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.4rem;
  max-height: 168px;
  overflow: auto;
  margin: 0.45rem 0 0.55rem;
  padding-right: 0.15rem;
}
.decor-chip {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  text-align: left;
  padding: 0.45rem 0.5rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.75);
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
}
.decor-chip .swatch {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.decor-chip.is-selected {
  border-color: var(--leaf);
  background: rgba(111,191,74,0.18);
  box-shadow: inset 0 0 0 1px rgba(63,154,69,0.25);
}
.decor-chip .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.browse-actions { display: grid; grid-template-columns: 1fr auto; gap: 0.4rem; }

.status {
  min-height: 1.2rem;
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 500;
}
.status.is-busy::before {
  content: "";
  display: inline-block;
  width: 0.55rem; height: 0.55rem;
  margin-right: 0.4rem;
  border-radius: 50%;
  background: var(--leaf);
  animation: pulse 0.9s ease-in-out infinite;
}

.results-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
}
.results-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.05rem;
}
#result-count { font-size: 0.72rem; color: var(--muted); font-weight: 600; }

.results {
  list-style: none;
  margin: 0;
  padding: 0;
  overflow: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.result-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 0.55rem;
  align-items: center;
  padding: 0.55rem 0.6rem;
  border-radius: 14px;
  background: rgba(255,255,255,0.72);
  border: 1px solid transparent;
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: inherit;
  width: 100%;
}
.result-item:hover, .result-item.is-active {
  border-color: rgba(63,154,69,0.35);
  background: #fff;
}
.result-item .badge {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 1rem;
  background: color-mix(in srgb, var(--accent) 22%, white);
}
.result-item .meta { min-width: 0; }
.result-item .title {
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.result-item .sub {
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 0.1rem;
}
.result-item .dist {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--leaf-deep);
  white-space: nowrap;
}

.panel-foot {
  font-size: 0.64rem;
  line-height: 1.35;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 0.55rem;
}

.leaflet-container { font: inherit; }
.decor-marker {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 6px 14px rgba(0,0,0,0.22);
  display: grid; place-items: center;
  font-size: 15px;
  transform: translateY(-2px);
}
.center-pin {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #f0c346;
  border: 3px solid #fff;
  box-shadow: 0 0 0 6px rgba(240,195,70,0.28), 0 8px 16px rgba(0,0,0,0.2);
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: none; }
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(16px) scale(0.985); }
  to { opacity: 1; transform: none; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
@keyframes pulse {
  0%, 100% { opacity: 0.35; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1); }
}

@media (max-width: 820px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .brand-bar { flex-direction: column; align-items: flex-start; }
  .stage {
    height: calc(100dvh - 7.5rem);
    min-height: 560px;
  }
  .panel {
    top: auto;
    left: 0.65rem;
    right: 0.65rem;
    bottom: 0.65rem;
    width: auto;
    max-height: 48%;
  }
}

/**
 * Build Overpass query for all decor types within detector range.
 *
 * Handles two tag matching modes:
 *   tags      – simple OR logic: any single tag match counts
 *   tagGroups – compound AND logic: every tag in a group must match;
 *               groups themselves are OR'd (e.g. Shrines & Temples)
 */
function buildOverpassQuery(lat, lon, radius = DETECTOR_RANGE) {
  const tagsByKey = {};
  const compoundLines = [];

  DECOR_MAPPINGS.forEach(decor => {
    (decor.tags || []).forEach(tag => {
      if (!tagsByKey[tag.key]) tagsByKey[tag.key] = new Set();
      tagsByKey[tag.key].add(tag.value);
    });

    (decor.tagGroups || []).forEach(group => {
      const predicates = group.map(t => `["${t.key}"="${t.value}"]`).join('');
      compoundLines.push(`nwr${predicates}(around:${radius},${lat},${lon});`);
    });
  });

  const tagQueries = [];
  for (const [key, values] of Object.entries(tagsByKey)) {
    const valueArray = Array.from(values);
    if (valueArray.length === 1) {
      tagQueries.push(`nwr["${key}"="${valueArray[0]}"](around:${radius},${lat},${lon});`);
    } else {
      const regexPattern = valueArray.map(v => v.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')).join('|');
      tagQueries.push(`nwr["${key}"~"^(${regexPattern})$"](around:${radius},${lat},${lon});`);
    }
  }

  return `
[out:json][timeout:30];
(
  ${[...tagQueries, ...compoundLines].join('\n  ')}
);
out center tags qt;
  `.trim();
}

/**
 * Match OSM element tags to ALL matching decor categories.
 * Returns an array of all decor types that match (supports double/multi-decor).
 * Handles semicolon-delimited OSM values (e.g. cuisine=pizza;burger).
 */
function matchDecorCategories(tags) {
  // Expand semicolon-delimited OSM values into flat key→[values] map
  const expandedValues = {};
  for (const [key, value] of Object.entries(tags)) {
    if (typeof value === 'string') {
      expandedValues[key] = value.split(';').map(v => v.trim());
    }
  }

  const matches = [];
  for (const decor of DECOR_MAPPINGS) {
    let matched = false;

    // Simple OR tags: any single tag match is enough
    for (const decorTag of (decor.tags || [])) {
      const tagValues = expandedValues[decorTag.key];
      if (tagValues && tagValues.includes(decorTag.value)) {
        matched = true;
        break;
      }
    }

    // Compound AND tag groups: every tag in a group must match; groups are OR'd
    if (!matched) {
      for (const group of (decor.tagGroups || [])) {
        if (group.every(t => {
          const vals = expandedValues[t.key];
          return vals && vals.includes(t.value);
        })) {
          matched = true;
          break;
        }
      }
    }

    if (matched) matches.push(decor);
  }
  return matches;
}

/**
 * Build Overpass query for a specific decor type within a bounding box.
 * Used by the "Browse by Decor" tab to find all instances in the current viewport.
 */
function buildOverpassBboxQuery(south, west, north, east, decorName) {
  const decor = DECOR_MAPPINGS.find(d => d.name === decorName);
  if (!decor) return null;

  const bbox = `${south},${west},${north},${east}`;

  const tagQueries = (decor.tags || []).map(tag =>
    `nwr["${tag.key}"="${tag.value}"](${bbox});`
  );

  const compoundLines = (decor.tagGroups || []).map(group => {
    const predicates = group.map(t => `["${t.key}"="${t.value}"]`).join('');
    return `nwr${predicates}(${bbox});`;
  });

  return `
[out:json][timeout:30];
(
  ${[...tagQueries, ...compoundLines].join('\n  ')}
);
out center tags qt;
  `.trim();
}

/**
 * Build a single Overpass query for multiple decor types within a bounding box.
 * Deduplicates tag queries across categories so the same OSM key/value pair
 * is only fetched once even if several selected decors share it.
 * Used by the "Refresh view" button on the Browse tab.
 */
function buildOverpassBboxQueryMulti(south, west, north, east, decorNames) {
  const relevantDecors = DECOR_MAPPINGS.filter(d => decorNames.includes(d.name));
  if (relevantDecors.length === 0) return null;

  const bbox = `${south},${west},${north},${east}`;
  const tagsByKey = {};
  const compoundLines = new Set(); // deduplicate identical compound queries

  relevantDecors.forEach(decor => {
    (decor.tags || []).forEach(tag => {
      if (!tagsByKey[tag.key]) tagsByKey[tag.key] = new Set();
      tagsByKey[tag.key].add(tag.value);
    });

    (decor.tagGroups || []).forEach(group => {
      const predicates = group.map(t => `["${t.key}"="${t.value}"]`).join('');
      compoundLines.add(`nwr${predicates}(${bbox});`);
    });
  });

  const tagQueries = [];
  for (const [key, values] of Object.entries(tagsByKey)) {
    const valueArray = Array.from(values);
    if (valueArray.length === 1) {
      tagQueries.push(`nwr["${key}"="${valueArray[0]}"](${bbox});`);
    } else {
      const regexPattern = valueArray.map(v => v.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')).join('|');
      tagQueries.push(`nwr["${key}"~"^(${regexPattern})$"](${bbox});`);
    }
  }

  return `
[out:json][timeout:30];
(
  ${[...tagQueries, ...compoundLines].join('\n  ')}
);
out center tags qt;
  `.trim();
}

  'https://overpass-api.de/api/interpreter',
];

const NOMINATIM = 'https://nominatim.openstreetmap.org';
const EARTH_R = 6371000;
/** ~5–6 km half-span — keeps Overpass queries fast */
const MAX_BBOX_SPAN_DEG = 0.1;
/** Default search window around a ZIP centroid (~4 km) */
const ZIP_PAD_DEG = 0.038;

const queryCache = new Map();
const CACHE_TTL_MS = 30 * 60 * 1000;
const GEOCODE_TTL_MS = 24 * 60 * 60 * 1000;
const LS_PREFIX = 'ubs:v2:';

let map;
let markersLayer;
let centerMarker;
let areaRect = null;
/** @type {Set<string>} */
let selectedDecors = new Set();
let activeAbort = null;
let lastCenter = { lat: DEFAULT.lat, lon: DEFAULT.lon };
let activeAreaLabel = 'map view';
let activeSearchBbox = null;
let lastResults = [];

const $ = (sel) => document.querySelector(sel);

function haversine(lat1, lon1, lat2, lon2) {
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLon = ((lon2 - lon1) * Math.PI) / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos((lat1 * Math.PI) / 180) *
      Math.cos((lat2 * Math.PI) / 180) *
      Math.sin(dLon / 2) ** 2;
  return Math.round(EARTH_R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

function setStatus(msg, busy = false) {
  const el = $('#status');
  el.textContent = msg;
  el.classList.toggle('is-busy', busy);
}

function elementLatLon(el) {
  if (el.type === 'node') return { lat: el.lat, lon: el.lon };
  if (el.center) return { lat: el.center.lat, lon: el.center.lon };
  if (el.lat != null) return { lat: el.lat, lon: el.lon };
  return null;
}

function placeName(tags = {}) {
  return tags.name || tags['name:en'] || tags.brand || tags.operator || 'Unnamed place';
}

function clampBbox(bbox) {
  let { south, west, north, east } = bbox;
  const latSpan = north - south;
  const lonSpan = east - west;
  if (latSpan > MAX_BBOX_SPAN_DEG) {
    const mid = (south + north) / 2;
    south = mid - MAX_BBOX_SPAN_DEG / 2;
    north = mid + MAX_BBOX_SPAN_DEG / 2;
  }
  if (lonSpan > MAX_BBOX_SPAN_DEG) {
    const mid = (west + east) / 2;
    west = mid - MAX_BBOX_SPAN_DEG / 2;
    east = mid + MAX_BBOX_SPAN_DEG / 2;
  }
  return { south, west, north, east };
}

function areaAround(lat, lon, pad = ZIP_PAD_DEG) {
  return clampBbox({
    south: lat - pad,
    north: lat + pad,
    west: lon - pad,
    east: lon + pad,
  });
}

function mapViewportBbox() {
  const b = map.getBounds();
  return clampBbox({
    south: b.getSouth(),
    west: b.getWest(),
    north: b.getNorth(),
    east: b.getEast(),
  });
}

function browseTargetBbox() {
  if (activeSearchBbox) return clampBbox(activeSearchBbox);
  return mapViewportBbox();
}

function updateFindButton() {
  const btn = $('#btn-find');

  else if (n === 1) btn.textContent = 'Show 1 type in area';
  else btn.textContent = `Show ${n} types in area`;
}

function cacheGet(key) {
  const mem = queryCache.get(key);
  if (mem && Date.now() - mem.at < CACHE_TTL_MS) return mem.elements;
  try {
    const raw = localStorage.getItem(LS_PREFIX + key);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.at > CACHE_TTL_MS) {
      localStorage.removeItem(LS_PREFIX + key);
      return null;
    }
    queryCache.set(key, parsed);
    return parsed.elements;
  } catch {
    return null;
  }
}

function cacheSet(key, elements) {
  const entry = { at: Date.now(), elements };
  queryCache.set(key, entry);
  try {
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(entry));
  } catch {
    /* quota — ignore */
  }
}

function cacheKey(s) {
  // short stable key
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return 'q' + (h >>> 0).toString(36);
}

/** Emit node+way lines (skip slow relations) for a tag filter */
function nwLines(filter, scope) {
  return [`node${filter}(${scope});`, `way${filter}(${scope});`];
}

/** Fast bbox query for selected decor types only */
function buildFastBboxQuery(south, west, north, east, decorNames) {
  const relevant = DECOR_MAPPINGS.filter((d) => decorNames.includes(d.name));
  if (!relevant.length) return null;
  const bbox = `${south},${west},${north},${east}`;
  const tagsByKey = {};
  const compound = new Set();

  relevant.forEach((decor) => {
    (decor.tags || []).forEach((tag) => {
      if (!tagsByKey[tag.key]) tagsByKey[tag.key] = new Set();
      tagsByKey[tag.key].add(tag.value);
    });
    (decor.tagGroups || []).forEach((group) => {
      const predicates = group.map((t) => `["${t.key}"="${t.value}"]`).join('');
      compound.add(predicates);
    });
  });

  const lines = [];
  for (const [key, values] of Object.entries(tagsByKey)) {
    const arr = [...values];
    const filter =
      arr.length === 1
        ? `["${key}"="${arr[0]}"]`
        : `["${key}"~"^(${arr.map((v) => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})$"]`;
    lines.push(...nwLines(filter, bbox));
  }
  compound.forEach((predicates) => {
    lines.push(...nwLines(predicates, bbox));
  });

  return `
[out:json][timeout:15];
(
  ${lines.join('\n  ')}
);
out center tags qt;
  `.trim();
}

/**
 * Race Overpass mirrors in parallel — first OK response wins.
 * Much faster from the US than trying Europe mirrors one-by-one.
 */
async function queryOverpass(query, { timeoutMs = 16000, signal } = {}) {
  const key = cacheKey(query);
  const cached = cacheGet(key);
  if (cached) return cached;

  if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');

  const errors = [];
  const controllers = [];

  const winner = await new Promise((resolve, reject) => {
    let settled = false;
    let pending = OVERPASS_SERVERS.length;

    const failOne = (err) => {
      errors.push(err);
      pending -= 1;
      if (!settled && pending === 0) {
        reject(errors.find((e) => e?.name !== 'AbortError') || errors[0] || new Error('Overpass failed'));
      }
    };

    const onExternalAbort = () => {
      controllers.forEach((c) => c.abort());
      if (!settled) {
        settled = true;
        reject(new DOMException('Aborted', 'AbortError'));
      }
    };
    signal?.addEventListener('abort', onExternalAbort, { once: true });

    OVERPASS_SERVERS.forEach((server) => {
      const ctrl = new AbortController();
      controllers.push(ctrl);
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);

      fetch(server, {
        method: 'POST',
        body: query,
        headers: { 'Content-Type': 'text/plain', Accept: 'application/json' },
        signal: ctrl.signal,
      })
        .then(async (res) => {
          clearTimeout(timer);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (settled) return;
          settled = true;
          controllers.forEach((c) => {
            if (c !== ctrl) c.abort();
          });
          signal?.removeEventListener('abort', onExternalAbort);
          resolve(data.elements || []);
        })
        .catch((err) => {
          clearTimeout(timer);
          failOne(err);
        });
    });
  });

  cacheSet(key, winner);
  return winner;
}

async function geocode(q) {
  const trimmed = q.trim();
  const gKey = LS_PREFIX + 'geo:' + trimmed.toLowerCase();
  try {
    const raw = localStorage.getItem(gKey);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Date.now() - parsed.at < GEOCODE_TTL_MS) return parsed.hit;
    }
  } catch {
    /* ignore */
  }

  const url = new URL(`${NOMINATIM}/search`);
  url.searchParams.set('format', 'json');
  url.searchParams.set('limit', '1');
  url.searchParams.set('addressdetails', '1');

  const zipMatch = trimmed.match(/^(\d{5})(?:-\d{4})?$/);
  if (zipMatch) {
    url.searchParams.set('postalcode', zipMatch[1]);
    url.searchParams.set('countrycodes', 'us');
  } else {
    url.searchParams.set('q', trimmed);
    url.searchParams.set('countrycodes', 'us');
  }

  const res = await fetch(url.toString(), {
    headers: { Accept: 'application/json', 'Accept-Language': 'en-US' },
  });
  if (!res.ok) throw new Error('Geocode failed');
  let data = await res.json();

  if (!data.length && !zipMatch) {
    const url2 = new URL(`${NOMINATIM}/search`);
    url2.searchParams.set('format', 'json');
    url2.searchParams.set('limit', '1');
    url2.searchParams.set('q', trimmed);
    const res2 = await fetch(url2.toString(), { headers: { Accept: 'application/json' } });
    if (res2.ok) data = await res2.json();
  }

  if (!data.length) return null;
  const hitRaw = data[0];
  const hit = {
    lat: parseFloat(hitRaw.lat),
    lon: parseFloat(hitRaw.lon),
    label: hitRaw.display_name,
  };
  try {
    localStorage.setItem(gKey, JSON.stringify({ at: Date.now(), hit }));
  } catch {
    /* ignore */
  }
  return hit;
}

/** Reverse-geocode lat/lon → US ZIP (and short label). Cached. */
async function reverseGeocode(lat, lon) {
  const key =
    LS_PREFIX +
    'rev:' +
    lat.toFixed(3) +
    ',' +
    lon.toFixed(3);
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Date.now() - parsed.at < GEOCODE_TTL_MS) return parsed.hit;
    }
  } catch {
    /* ignore */
  }

  const url = new URL(`${NOMINATIM}/reverse`);
  url.searchParams.set('format', 'json');
  url.searchParams.set('lat', String(lat));
  url.searchParams.set('lon', String(lon));
  url.searchParams.set('zoom', '18');
  url.searchParams.set('addressdetails', '1');

  const res = await fetch(url.toString(), {
    headers: { Accept: 'application/json', 'Accept-Language': 'en-US' },
  });
  if (!res.ok) throw new Error('Reverse geocode failed');
  const data = await res.json();
  const addr = data.address || {};
  const zip = (addr.postcode || '').toString().match(/\d{5}/)?.[0] || null;
  const city =
    addr.city || addr.town || addr.village || addr.hamlet || addr.county || '';
  const state = addr.state || '';
  const hit = {
    lat,
    lon,
    zip,
    label: data.display_name || [zip, city, state].filter(Boolean).join(', '),
    city,
    state,
  };
  try {
    localStorage.setItem(key, JSON.stringify({ at: Date.now(), hit }));
  } catch {
    /* ignore */
  }
  return hit;
}

let reverseTimer = null;
let suppressReverseUntil = 0;
let lastShownZip = '';

function pauseAutoZip(ms = 1200) {
  suppressReverseUntil = Date.now() + ms;
}

/** Update the search box + active area from a map position */
async function syncZipFromLatLon(lat, lon, { quiet = false } = {}) {
  try {
    const hit = await reverseGeocode(lat, lon);
    activeAreaLabel = hit.label;
    activeSearchBbox = areaAround(lat, lon);
    if (hit.zip) {
      if (hit.zip !== lastShownZip) {
        $('#address').value = hit.zip;
        lastShownZip = hit.zip;
      }
      if (!quiet) {
        const place = [hit.city, hit.state].filter(Boolean).join(', ');
        setStatus(`ZIP ${hit.zip}${place ? ` · ${place}` : ''} — select decor types, then Show in area.`);
      }
    } else if (!quiet) {
      setStatus('No ZIP for this spot — still searchable on the map.');
    }
    return hit;
  } catch (err) {
    console.warn(err);
    if (!quiet) setStatus('Could not resolve ZIP for this location.');
    return null;
  }
}

function scheduleZipFromMapCenter() {
  if (Date.now() < suppressReverseUntil) return;
  clearTimeout(reverseTimer);
  reverseTimer = setTimeout(() => {
    if (Date.now() < suppressReverseUntil) return;
    const c = map.getCenter();
    syncZipFromLatLon(c.lat, c.lng, { quiet: true });
  }, 650);
}

function cancelInFlight() {
  if (activeAbort) activeAbort.abort();
  activeAbort = new AbortController();
  return activeAbort.signal;
}

function clearMapOverlays({ keepMarkers = false } = {}) {
  if (!keepMarkers) markersLayer.clearLayers();
  if (centerMarker) {
    map.removeLayer(centerMarker);
    centerMarker = null;
  }
  if (areaRect) {
    map.removeLayer(areaRect);
    areaRect = null;
  }
}

/** Drop a pin and show the active search area for Find a decor */
function setAreaPin(lat, lon, { zoom = 14, fly = true, bbox = null } = {}) {
  lastCenter = { lat, lon };
  const box = bbox || activeSearchBbox || areaAround(lat, lon);
  activeSearchBbox = box;

  if (centerMarker) map.removeLayer(centerMarker);
  if (areaRect) map.removeLayer(areaRect);

  const icon = L.divIcon({
    className: '',
    html: '<div class="center-pin"></div>',
    iconSize: [18, 18],
    iconAnchor: [9, 9],
  });
  centerMarker = L.marker([lat, lon], { icon, zIndexOffset: 1000 }).addTo(map);
  areaRect = L.rectangle(
    [
      [box.south, box.west],
      [box.north, box.east],
    ],
    {
      color: '#3f9a45',
      weight: 1.5,
      dashArray: '6 4',
      fillColor: '#6fbf4a',
      fillOpacity: 0.06,
      interactive: false,
    }
  ).addTo(map);

  if (fly) map.setView([lat, lon], zoom, { animate: true, duration: 0.35 });
  else map.setView([lat, lon], zoom, { animate: false });
}

function markerIcon(decor) {
  return L.divIcon({
    className: '',
    html: `<div class="decor-marker" style="background:${decor.color}">${decor.icon}</div>`,
    iconSize: [34, 34],
    iconAnchor: [17, 17],
  });
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderResults(items) {
  lastResults = items;
  const list = $('#results');
  list.innerHTML = '';
  $('#result-count').textContent = `${items.length} place${items.length === 1 ? '' : 's'}`;

  items.forEach((item) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'result-item';
    btn.style.setProperty('--accent', item.decor.color);
    btn.innerHTML = `
      <span class="badge">${item.decor.icon}</span>
      <span class="meta">
        <div class="title">${escapeHtml(item.name)}</div>
        <div class="sub">${escapeHtml(item.decor.name)}${item.decor.costume ? ` · ${escapeHtml(item.decor.costume)}` : ''}</div>
      </span>
      <span class="dist">${item.dist != null ? `${item.dist} m` : ''}</span>
    `;
    btn.addEventListener('click', () => {
      list.querySelectorAll('.result-item').forEach((el) => el.classList.remove('is-active'));
      btn.classList.add('is-active');
      map.setView([item.lat, item.lon], Math.max(map.getZoom(), 17), { animate: true });
      if (item.marker) item.marker.openPopup();
    });
    list.appendChild(btn);
  });
}

function elementsToResults(elements, origin) {
  const seen = new Set();
  const out = [];
  for (const el of elements) {
    const pos = elementLatLon(el);
    if (!pos || !el.tags) continue;
    const key = `${el.type}/${el.id}`;
    if (seen.has(key)) continue;
    seen.add(key);
    const matches = matchDecorCategories(el.tags);
    if (!matches.length) continue;
    for (const decor of matches) {
      out.push({
        id: `${key}:${decor.name}`,
        name: placeName(el.tags),
        lat: pos.lat,
        lon: pos.lon,
        decor,
        dist: origin ? haversine(origin.lat, origin.lon, pos.lat, pos.lon) : null,
        tags: el.tags,
      });
    }
  }
  out.sort((a, b) => (a.dist ?? 0) - (b.dist ?? 0));
  return out;
}

function plotResults(items) {
  markersLayer.clearLayers();
  for (const item of items) {
    const marker = L.marker([item.lat, item.lon], { icon: markerIcon(item.decor) })
      .bindPopup(
        `<strong>${escapeHtml(item.name)}</strong><br>${escapeHtml(item.decor.name)}` +
          (item.decor.costume ? `<br><em>${escapeHtml(item.decor.costume)}</em>` : '') +
          (item.dist != null ? `<br>${item.dist} m away` : '')
      )
      .addTo(markersLayer);
    item.marker = marker;
  }
}

/** Find selected decor type(s) in the searched ZIP/city (or current map view) */
async function browseDecorInView(decorNames) {
  const names = [...decorNames];
  if (!names.length) return;
  const signal = cancelInFlight();

  const bbox = browseTargetBbox();
  const areaNote = activeSearchBbox
    ? activeAreaLabel.split(',').slice(0, 2).join(',')
    : 'current map view';
  const label =
    names.length === 1 ? names[0] : `${names.length} decor types`;
  setStatus(`Finding ${label} near ${areaNote}…`, true);

  // Keep pin/area; only clear decor markers
  markersLayer.clearLayers();

  pauseAutoZip(2000);
  map.fitBounds(
    [
      [bbox.south, bbox.west],
      [bbox.north, bbox.east],
    ],
    { padding: [28, 28], maxZoom: 15, animate: true }
  );

  const t0 = performance.now();
  try {
    const query = buildFastBboxQuery(
      bbox.south,
      bbox.west,
      bbox.north,
      bbox.east,
      names
    );
    if (!query) {
      setStatus('No decor types selected.');
      return;
    }
    const elements = await queryOverpass(query, { signal, timeoutMs: 16000 });

    const nameSet = new Set(names);
    const origin = {
      lat: (bbox.south + bbox.north) / 2,
      lon: (bbox.west + bbox.east) / 2,
    };
    const items = elementsToResults(elements, origin).filter((i) =>
      nameSet.has(i.decor.name)
    );

    plotResults(items);
    renderResults(items);
    const ms = Math.round(performance.now() - t0);

    if (items.length) {
      const group = L.featureGroup(items.map((i) => i.marker));
      map.fitBounds(group.getBounds().pad(0.12), { maxZoom: 15, animate: true });
      setStatus(
        `${items.length} place${items.length === 1 ? '' : 's'} · ${label} (${ms} ms).`
      );
    } else {
      setStatus(`No matching spots for ${label} in ${areaNote} (${ms} ms).`);
    }
  } catch (err) {
    if (err.name === 'AbortError') return;
    console.error(err);
    setStatus('Browse request failed. Try fewer types or a smaller area.');
  }
}

function buildDecorGrid(filter = '') {
  const grid = $('#decor-grid');
  const q = filter.trim().toLowerCase();
  grid.innerHTML = '';
  DECOR_MAPPINGS.filter((d) => {
    if (!q) return true;
    return (
      d.name.toLowerCase().includes(q) ||
      (d.costume && d.costume.toLowerCase().includes(q))
    );
  }).forEach((d) => {
    const on = selectedDecors.has(d.name);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'decor-chip' + (on ? ' is-selected' : '');
    btn.setAttribute('role', 'option');
    btn.setAttribute('aria-selected', on ? 'true' : 'false');
    btn.title = (d.costume || d.name) + ' — click to toggle';
    btn.innerHTML = `<span class="swatch" style="background:${d.color}"></span><span class="name">${d.icon} ${d.name}</span>`;
    btn.addEventListener('click', () => {
      if (selectedDecors.has(d.name)) selectedDecors.delete(d.name);
      else selectedDecors.add(d.name);
      updateFindButton();
      buildDecorGrid($('#decor-filter').value);
    });
    grid.appendChild(btn);
  });
  updateFindButton();
}

function initMap() {
  map = L.map('map', {
    zoomControl: false,
    attributionControl: true,
    fadeAnimation: false,
    zoomAnimation: true,
    markerZoomAnimation: false,
  }).setView([DEFAULT.lat, DEFAULT.lon], DEFAULT.zoom);

  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    opacity: 1,
    updateWhenIdle: true,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);

  map.on('click', async (e) => {
    const { lat, lng } = e.latlng;
    pauseAutoZip(1500);
    activeSearchBbox = areaAround(lat, lng);
    setAreaPin(lat, lng, { zoom: Math.max(map.getZoom(), 14), fly: false });
    await syncZipFromLatLon(lat, lng);
  });

  map.on('moveend', () => scheduleZipFromMapCenter());

  requestAnimationFrame(() => {
    map.invalidateSize({ animate: false });
    setTimeout(() => map.invalidateSize({ animate: false }), 100);
  });
}

function bindUi() {
  buildDecorGrid();

  $('#decor-filter').addEventListener('input', (e) => buildDecorGrid(e.target.value));

  $('#btn-find').addEventListener('click', () => {
    if (selectedDecors.size) browseDecorInView(selectedDecors);
  });

  $('#btn-clear').addEventListener('click', () => {
    cancelInFlight();
    selectedDecors.clear();
    activeSearchBbox = null;
    activeAreaLabel = 'map view';
    lastShownZip = '';
    updateFindButton();
    buildDecorGrid($('#decor-filter').value);
    clearMapOverlays();
    renderResults([]);
    $('#address').value = '';
    setStatus('Cleared. Click the map or search a ZIP.');
  });

  const runSearch = async () => {
    const q = $('#address').value.trim();
    if (!q) {
      setStatus('Enter a US ZIP, city, or address — or click the map.');
      return;
    }
    setStatus(`Looking up “${q}”…`, true);
    pauseAutoZip(2000);
    try {
      const hit = await geocode(q);
      if (!hit) {
        setStatus('No matching place found. Try a US ZIP (e.g. 78701) or city.');
        return;
      }
      activeAreaLabel = hit.label;
      activeSearchBbox = areaAround(hit.lat, hit.lon);
      if (/^\d{5}/.test(q)) {
        lastShownZip = q.slice(0, 5);
        $('#address').value = lastShownZip;
      } else {
        syncZipFromLatLon(hit.lat, hit.lon, { quiet: true });
      }
      setAreaPin(hit.lat, hit.lon, { zoom: 14, fly: true, bbox: activeSearchBbox });
      setStatus(
        `Area set: ${hit.label.split(',').slice(0, 2).join(',')}. Select decor → Show in area.`
      );
    } catch (err) {
      console.error(err);
      setStatus('Address lookup failed.');
    }
  };

  $('#btn-search').addEventListener('click', runSearch);
  $('#address').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') runSearch();
  });

  $('#btn-locate').addEventListener('click', () => {
    if (!navigator.geolocation) {
      setStatus('Geolocation not available in this browser.');
      return;
    }
    setStatus('Getting your location…', true);
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude: lat, longitude: lon } = pos.coords;
        pauseAutoZip(2000);
        activeSearchBbox = areaAround(lat, lon);
        setAreaPin(lat, lon, { zoom: 14, fly: true });
        await syncZipFromLatLon(lat, lon);
      },
      () => setStatus('Location permission blocked.'),
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });
}

async function boot() {
  initMap();
  bindUi();
  setStatus('Click the map or search a ZIP, then select decor types.');
}

boot();
</script>
</body></html>
