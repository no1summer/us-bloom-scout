<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#3f9a45" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>US Bloom Scout — Fast Pikmin Bloom Decor Map</title>
  <meta name="description" content="US-first Pikmin Bloom decor map. Search any US ZIP or city — click the map to update ZIP and find decor types." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=20260724c" />
</head>
<body>
  <div class="app">
    <header class="brand-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="36" height="36">
            <circle cx="24" cy="28" r="12" fill="#6FBF4A"/>
            <ellipse cx="24" cy="12" rx="7" ry="10" fill="#3D8B2E"/>
            <circle cx="18" cy="26" r="2.2" fill="#1A3A14"/>
            <circle cx="30" cy="26" r="2.2" fill="#1A3A14"/>
            <path d="M20 32c2.2 2.4 5.8 2.4 8 0" stroke="#1A3A14" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <path d="M24 2c4 4 4 8 0 10c-4-2-4-6 0-10z" fill="#F4D35E"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>US Bloom Scout</h1>
          <p>Find Pikmin Bloom decor anywhere in the US</p>
        </div>
      </div>
    </header>

    <main class="stage">
      <div id="map" role="application" aria-label="Decor location map"></div>
      <div class="map-veil" aria-hidden="true"></div>

      <aside class="panel is-expanded" id="panel">
        <button type="button" class="panel-handle" id="panel-handle" aria-label="Expand or collapse panel" aria-expanded="true">
          <span class="handle-bar" aria-hidden="true"></span>
        </button>
        <div class="panel-glow" aria-hidden="true"></div>

        <div class="panel-scroll" id="panel-scroll">
          <div class="search-row">
            <label class="sr-only" for="address">Search address</label>
            <input id="address" type="search" inputmode="search" enterkeyhint="search" placeholder="ZIP / city — tap map to set…" autocomplete="off" />
            <button type="button" id="btn-locate" class="icon-btn" title="Use my location" aria-label="Use my location">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
                <circle cx="12" cy="12" r="8"/>
              </svg>
            </button>
            <button type="button" id="btn-search" class="primary-btn">Go</button>
          </div>

          <p class="hint">Tap the map for a ZIP, pick decor types below, then Show in area.</p>

          <div class="decor-picker" id="decor-picker">
            <label class="field-label" for="decor-filter">Decor types (multi-select)</label>
            <input
              id="decor-filter"
              type="search"
              inputmode="search"
              enterkeyhint="done"
              placeholder="Filter: roadside, park, sushi…"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
            />
            <div id="decor-selected" class="decor-selected" hidden></div>
            <div id="decor-grid" class="decor-grid" role="listbox" aria-multiselectable="true" aria-label="Decor categories"></div>
            <p id="decor-empty" class="decor-empty" hidden>No types match that search.</p>
          </div>

          <div class="status" id="status" aria-live="polite"></div>

          <div class="results-head">
            <h2>Results</h2>
            <span id="result-count">0 places</span>
          </div>
          <ul id="results" class="results"></ul>

          <footer class="panel-foot">
            US-first geocoding and map search. OSM tags approximate in-game decor; Bloom may still differ.
          </footer>
        </div>

        <div class="panel-dock" id="panel-dock">
          <div class="browse-actions">
            <button type="button" id="btn-find" class="primary-btn" disabled>Show in area</button>
            <button type="button" id="btn-clear" class="ghost-btn">Clear</button>
          </div>
          <label class="pure-toggle">
            <input type="checkbox" id="pure-only" />
            <span>Pure only <em>(alone vs other types + Roadside ~100&nbsp;m)</em></span>
          </label>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="decor-mappings.js?v=20260724c"></script>
  <script src="app.js?v=20260724c"></script>
</body>
</html>
